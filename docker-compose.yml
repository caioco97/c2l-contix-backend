name: contix

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contix}
      POSTGRES_USER: ${POSTGRES_USER:-contix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contix}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servidor SMTP de desenvolvimento: captura todos os e-mails. Caixa de entrada em http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-contix};Username=${POSTGRES_USER:-contix};Password=${POSTGRES_PASSWORD:-contix}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Defina JWT_SIGNING_KEY no arquivo .env}
      Cors__AllowedOrigins__0: ${FRONTEND_URL:-http://localhost:5173}
      Database__MigrateOnStartup: ${DB_MIGRATE_ON_STARTUP:-true}
      Database__SeedDemoData: ${DB_SEED_DEMO:-true}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      # Proxy confiável para X-Forwarded-For (IP real na auditoria e no rate limit): só a rede
      # interna deste compose (ver "networks" abaixo), onde roda o nginx do frontend.
      ForwardedHeaders__RedesConfiaveis__0: ${PROXY_REDE_CONFIAVEL:-172.28.10.0/24}
      Notificacoes__UrlFrontend: ${FRONTEND_URL:-http://localhost:5173}
      # Chave AES-256 dos certificados A1 guardados no banco. Gere com: openssl rand -base64 32
      Criptografia__Chave: ${CRIPTOGRAFIA_CHAVE:?Defina CRIPTOGRAFIA_CHAVE no arquivo .env}
      NFe__Sefaz__Provider: ${NFE_SEFAZ_PROVIDER:-Simulado}
      NFe__Sefaz__Ambiente: ${NFE_SEFAZ_AMBIENTE:-Homologacao}
      Email__Provider: ${EMAIL_PROVIDER:-Smtp}
      Email__Remetente: ${EMAIL_REMETENTE:-nao-responda@contix.dev}
      Email__Smtp__Host: ${SMTP_HOST:-mailpit}
      Email__Smtp__Porta: ${SMTP_PORT:-1025}
      Email__Smtp__Seguranca: ${SMTP_SEGURANCA:-None}
      Email__Smtp__Usuario: ${SMTP_USUARIO:-}
      Email__Smtp__Senha: ${SMTP_SENHA:-}
    ports:
      - "${API_PORT:-5080}:8080"
    volumes:
      - storage:/app/storage

volumes:
  pgdata:
  storage:

# Rede interna com faixa fixa: é a única confiável para X-Forwarded-For (PROXY_REDE_CONFIAVEL).
networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.28.10.0/24}
