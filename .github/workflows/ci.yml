name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Contix.slnx

      - name: Build
        run: dotnet build Contix.slnx --no-restore -c Release

      - name: Test
        run: dotnet test Contix.slnx --no-build -c Release --logger "trx;LogFilePrefix=results"

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t contix-api:${{ github.sha }} .
